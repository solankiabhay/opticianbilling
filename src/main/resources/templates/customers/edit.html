<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/header :: header"></head><body>
<div th:replace="layout/sidebar :: sidebar"></div><div class="main-content"><div th:replace="layout/navbar :: navbar"></div>
<div class="container-fluid p-4"><div class="row mb-4"><div class="col-12"><h3 class="fw-bold">Edit Customer</h3><p class="text-muted">Update customer information</p></div></div>
<div class="row"><div class="col-md-8 mx-auto"><div class="card shadow-sm"><div class="card-header bg-warning text-white"><h5 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Customer: <span th:text="${customer.name}"></span></h5></div>
<div class="card-body">
<div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div><form th:action="@{/customers/update/{id}(id=${customer.id})}" method="post" id="customerForm">
<h6 class="fw-bold mb-3"><i class="fas fa-user me-2 text-primary"></i>Personal Details</h6>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label">Full Name <span class="text-danger">*</span></label><input type="text" class="form-control" name="name" th:value="${customer.name}" required></div><div class="col-md-6 mb-3"><label class="form-label">Phone Number <span class="text-danger">*</span></label><input type="tel" class="form-control" name="phone" th:value="${customer.phone}" required pattern="[0-9]{10}"></div></div>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label">Email Address</label><input type="email" class="form-control" name="email" th:value="${customer.email}"></div><div class="col-md-6 mb-3"><label class="form-label">Customer Code</label><input type="text" class="form-control" th:value="${customer.customerCode}" disabled></div></div>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="age">Age</label><input type="number" class="form-control" id="age" name="age" min="0" max="130" step="1" th:value="${customer.age}" placeholder="Age in years (optional)"></div></div>
<h6 class="fw-bold mb-3 mt-3"><i class="fas fa-map-marker-alt me-2 text-primary"></i>Address Details</h6><div class="mb-3"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="2" th:text="${customer.address}"></textarea></div>
<div class="row"><div class="col-md-4 mb-3"><label class="form-label">City</label><input type="text" class="form-control" name="city" th:value="${customer.city}"></div><div class="col-md-4 mb-3"><label class="form-label">State</label><select class="form-select" name="state"><option value="">Select State</option><option value="Maharashtra" th:selected="${customer.state == 'Maharashtra'}">Maharashtra</option><option value="Delhi" th:selected="${customer.state == 'Delhi'}">Delhi</option><option value="Karnataka" th:selected="${customer.state == 'Karnataka'}">Karnataka</option><option value="Tamil Nadu" th:selected="${customer.state == 'Tamil Nadu'}">Tamil Nadu</option><option value="Gujarat" th:selected="${customer.state == 'Gujarat'}">Gujarat</option><option value="West Bengal" th:selected="${customer.state == 'West Bengal'}">West Bengal</option><option value="Rajasthan" th:selected="${customer.state == 'Rajasthan'}">Rajasthan</option><option value="Uttar Pradesh" th:selected="${customer.state == 'Uttar Pradesh'}">Uttar Pradesh</option></select></div><div class="col-md-4 mb-3"><label class="form-label">Pincode</label><input type="text" class="form-control" name="pincode" th:value="${customer.pincode}" pattern="[0-9]{6}"></div></div>
<div class="alert alert-info mt-3"><i class="fas fa-info-circle me-2"></i>Registered on: <span th:text="${customer.createdAt}"></span></div><hr>
<div class="d-flex justify-content-end gap-2"><a th:href="@{/customers}" class="btn btn-secondary"><i class="fas fa-times me-2"></i>Cancel</a><button type="submit" class="btn btn-warning"><i class="fas fa-save me-2"></i>Update Customer</button></div>
</form></div></div></div></div></div></div><div th:replace="layout/footer :: footer"></div><script th:src="@{/js/customers.js}"></script></body></html>
