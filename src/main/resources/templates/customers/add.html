<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/header :: header"></head>
<body>
<div th:replace="layout/sidebar :: sidebar"></div>
<div class="main-content">
<div th:replace="layout/navbar :: navbar"></div>
<div class="container-fluid p-4">
<div class="row mb-4"><div class="col-12"><h3 class="fw-bold">Add New Customer</h3><p class="text-muted">Create a new customer profile</p></div></div>
<div class="row"><div class="col-md-8 mx-auto"><div class="card shadow-sm">
<div class="card-header bg-primary text-white"><h5 class="mb-0"><i class="fas fa-user-plus me-2"></i>Customer Information</h5></div>
<div class="card-body">
<div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
<form th:action="@{/customers/save}" method="post" id="customerForm">
<h6 class="fw-bold mb-3"><i class="fas fa-user me-2 text-primary"></i>Personal Details</h6>
<div class="row">
<div class="col-md-6 mb-3"><label class="form-label">Full Name <span class="text-danger">*</span></label><input type="text" class="form-control" name="name" required placeholder="Enter full name"></div>
<div class="col-md-6 mb-3"><label class="form-label">Phone Number <span class="text-danger">*</span></label><input type="tel" class="form-control" name="phone" required placeholder="10 digit mobile number" maxlength="10" pattern="[0-9]{10}"></div>
</div>
<div class="row">
<div class="col-md-6 mb-3"><label class="form-label">Email Address</label><input type="email" class="form-control" name="email" placeholder="customer@example.com"></div>
<div class="col-md-6 mb-3"><label class="form-label">Customer Code</label><input type="text" class="form-control" readonly value="Auto generated" disabled></div>
</div>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="age">Age</label><input type="number" class="form-control" id="age" name="age" min="0" max="130" step="1" inputmode="numeric" placeholder="Age in years (optional)"></div></div>
<h6 class="fw-bold mb-3 mt-3"><i class="fas fa-map-marker-alt me-2 text-primary"></i>Address Details</h6>
<div class="mb-3"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="2" placeholder="Enter full address"></textarea></div>
<div class="row">
<div class="col-md-4 mb-3"><label class="form-label">City</label><input type="text" class="form-control" name="city" placeholder="City"></div>
<div class="col-md-4 mb-3"><label class="form-label">State</label><select class="form-select" name="state"><option value="">Select State</option><option value="Andhra Pradesh">Andhra Pradesh</option><option value="Arunachal Pradesh">Arunachal Pradesh</option><option value="Assam">Assam</option><option value="Bihar">Bihar</option><option value="Chhattisgarh">Chhattisgarh</option><option value="Goa">Goa</option><option value="Gujarat">Gujarat</option><option value="Haryana">Haryana</option><option value="Himachal Pradesh">Himachal Pradesh</option><option value="Jharkhand">Jharkhand</option><option value="Karnataka">Karnataka</option><option value="Kerala">Kerala</option><option value="Madhya Pradesh">Madhya Pradesh</option><option value="Maharashtra">Maharashtra</option><option value="Manipur">Manipur</option><option value="Meghalaya">Meghalaya</option><option value="Mizoram">Mizoram</option><option value="Nagaland">Nagaland</option><option value="Odisha">Odisha</option><option value="Punjab">Punjab</option><option value="Rajasthan">Rajasthan</option><option value="Sikkim">Sikkim</option><option value="Tamil Nadu">Tamil Nadu</option><option value="Telangana">Telangana</option><option value="Tripura">Tripura</option><option value="Uttar Pradesh">Uttar Pradesh</option><option value="Uttarakhand">Uttarakhand</option><option value="West Bengal">West Bengal</option></select></div>
<div class="col-md-4 mb-3"><label class="form-label">Pincode</label><input type="text" class="form-control" name="pincode" placeholder="Pincode" pattern="[0-9]{6}"></div>
</div><hr><div class="d-flex justify-content-end gap-2"><a th:href="@{/customers}" class="btn btn-secondary"><i class="fas fa-times me-2"></i>Cancel</a><button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Save Customer</button></div>
</form></div></div></div></div></div></div>
<div th:replace="layout/footer :: footer"></div><script th:src="@{/js/customers.js}"></script>
</body></html>
