<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/header :: header"></head>
<body>
<div th:replace="layout/sidebar :: sidebar"></div>
<div class="main-content"><div th:replace="layout/navbar :: navbar"></div>
<div class="container-fluid p-4">
<div class="d-flex justify-content-between align-items-center mb-4"><div><h3 class="fw-bold">Customers</h3><p class="text-muted mb-0">Manage customer profiles and purchase history</p></div><a class="btn btn-primary" th:href="@{/customers/add}"><i class="fas fa-user-plus me-2"></i>Add Customer</a></div>
<div class="card shadow-sm"><div class="card-body">
<form th:action="@{/customers/search}" method="get" class="row g-2 mb-3"><div class="col-md-6"><input class="form-control" type="search" name="keyword" th:value="${keyword}" placeholder="Search by name or phone"></div><div class="col-auto"><button class="btn btn-outline-primary" type="submit">Search</button></div><div class="col-auto"><a class="btn btn-outline-secondary" th:href="@{/customers}">Clear</a></div></form>
<div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>Code</th><th>Name</th><th>Phone</th><th>Age</th><th>Email</th><th>City</th><th class="text-end">Actions</th></tr></thead><tbody>
<tr th:each="customer : ${customers}"><td th:text="${customer.customerCode}"></td><td><span class="fw-semibold" th:text="${customer.name}"></span></td><td th:text="${customer.phone}"></td><td th:text="${customer.age != null ? customer.age + ' years' : '—'}"></td><td th:text="${customer.email != null ? customer.email : '—'}"></td><td th:text="${customer.city != null ? customer.city : '—'}"></td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/customers/view/{id}(id=${customer.id})}" title="View"><i class="fas fa-eye"></i></a> <a class="btn btn-sm btn-outline-warning" th:href="@{/customers/edit/{id}(id=${customer.id})}" title="Edit"><i class="fas fa-edit"></i></a> <a class="btn btn-sm btn-outline-secondary" th:href="@{/customers/history/{id}(id=${customer.id})}" title="History"><i class="fas fa-history"></i></a></td></tr>
<tr th:if="${#lists.isEmpty(customers)}"><td colspan="7" class="text-center text-muted py-4">No customers found.</td></tr>
</tbody></table></div></div></div></div></div>
<div th:replace="layout/footer :: footer"></div>
</body></html>
