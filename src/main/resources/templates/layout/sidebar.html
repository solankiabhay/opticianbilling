<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="app-sidebar" id="appSidebar" aria-label="Main navigation">
  <div class="d-flex justify-content-between align-items-center">
    <div class="app-brand"><i class="fa-solid fa-glasses me-2"></i>Surya Optics</div>
    <button type="button" class="btn btn-sm btn-outline-light d-lg-none mb-3" id="mobileMenuClose" aria-label="Close navigation menu"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <nav>
    <a th:href="@{/dashboard}"><i class="fa-solid fa-gauge-high fa-fw me-2"></i>Dashboard</a>
    <a th:href="@{/customers}"><i class="fa-solid fa-users fa-fw me-2"></i>Customers</a>
    <a th:href="@{/customers/add}"><i class="fa-solid fa-user-plus fa-fw me-2"></i>Add customer</a>
    <a th:href="@{/bills}"><i class="fa-solid fa-file-invoice-dollar fa-fw me-2"></i>Bills & invoices</a>
    <a th:href="@{/bills/add}"><i class="fa-solid fa-circle-plus fa-fw me-2"></i>Create bill</a>
    <a th:href="@{/products}"><i class="fa-solid fa-boxes-stacked fa-fw me-2"></i>Product inventory</a>
    <a th:href="@{/products/add}"><i class="fa-solid fa-box-open fa-fw me-2"></i>Add product</a>
    <a th:href="@{/reports}"><i class="fa-solid fa-chart-column fa-fw me-2"></i>Sales reports</a>
    <a th:href="@{/prescriptions}"><i class="fa-solid fa-eye fa-fw me-2"></i>Prescriptions</a>
    <a th:href="@{/prescriptions/add}"><i class="fa-solid fa-file-medical fa-fw me-2"></i>New prescription</a>
    <form th:action="@{/logout}" method="post" class="mt-3">
      <button type="submit" class="btn btn-link text-start text-decoration-none w-100 px-3 py-2 text-white-50"><i class="fa-solid fa-right-from-bracket fa-fw me-2"></i>Sign out</button>
    </form>
  </nav>
  <div class="small mt-4 px-2 text-white-50">Billing workspace</div>
</aside>
</body>
</html>
