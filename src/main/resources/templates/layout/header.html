<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123b72">
<title>Surya Optics Billing</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
:root{--brand:#123b72;--brand-hover:#1d5ba8;--page:#f4f6fa;--ink:#1f2937;--line:#e5e7eb}
html{scroll-behavior:smooth}body{background:var(--page);color:var(--ink);margin:0}
.main-content{margin-left:250px;min-height:100vh;min-width:0}
.app-sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--brand);color:#fff;padding:20px 14px;z-index:1040;overflow-y:auto;overscroll-behavior:contain}
.app-sidebar a{color:#e7eef8;text-decoration:none;display:flex;align-items:center;gap:2px;padding:11px 12px;border-radius:9px;margin:3px 0;min-height:42px;transition:background .15s ease}
.app-sidebar a:hover,.app-sidebar a:focus-visible{background:#ffffff20;color:#fff;outline:none}
.app-brand{font-size:18px;font-weight:750;margin:6px 10px 24px;white-space:nowrap}
.app-navbar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;min-height:62px;z-index:1020}
.app-page-title{font-weight:750;letter-spacing:-.02em}
.container-fluid{max-width:1600px}
.card{border:1px solid #e8edf4;border-radius:14px}
.card-header{border-bottom-color:#edf0f5;border-radius:14px 14px 0 0!important}
.btn{border-radius:9px}
.form-control,.form-select{min-height:42px;border-color:#d8e0eb;border-radius:9px}
.form-control:focus,.form-select:focus{border-color:#4d85c7;box-shadow:0 0 0 .2rem #1d5ba81c}
.table>:not(caption)>*>*{padding:.8rem .85rem}
.table thead th{font-size:.78rem;text-transform:uppercase;letter-spacing:.035em;color:#64748b;background:#f8fafc;white-space:nowrap}
.sidebar-backdrop{display:none}
.mobile-menu-button{display:none}
@media(max-width:991.98px){
 .main-content{margin-left:0;width:100%}
 .app-sidebar{width:min(290px,86vw);transform:translateX(-105%);transition:transform .22s ease;box-shadow:12px 0 32px #0f172a25;padding-top:max(18px,env(safe-area-inset-top));}
 .app-sidebar.is-open{transform:translateX(0)}
 .sidebar-backdrop.is-visible{display:block;position:fixed;inset:0;background:#0f172a80;z-index:1030}
 .mobile-menu-button{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px}
 .app-navbar{padding:10px 14px}
 .container-fluid{padding:1rem!important}
}
@media(max-width:575.98px){
 .container-fluid{padding:.8rem!important}
 h1,.h1{font-size:1.5rem}h2,.h2{font-size:1.3rem}h3,.h3{font-size:1.2rem}
 .table>:not(caption)>*>*{padding:.65rem .6rem}
 .app-navbar .navbar-subtitle{display:none}
 .btn{--bs-btn-padding-y:.42rem;--bs-btn-padding-x:.7rem}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.app-sidebar{transition:none}}
@media print{body{background:#fff}.app-sidebar,.app-navbar,.sidebar-backdrop,.mobile-menu-button,.no-print{display:none!important}.main-content{margin:0!important;width:100%!important}.container-fluid{max-width:none!important;padding:0!important}.card{box-shadow:none!important;border:0!important}}
</style>
</head></html>
