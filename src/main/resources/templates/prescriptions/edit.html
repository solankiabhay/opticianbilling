<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="layout/header :: header"></head><body>
<div th:replace="layout/sidebar :: sidebar"></div><div class="main-content"><div th:replace="layout/navbar :: navbar"></div><div class="container-fluid p-4">
<div class="mb-4"><h3 class="fw-bold">Edit prescription</h3><p class="text-muted">Update the patient's optical measurements</p></div>
<div class="card shadow-sm"><div class="card-body p-4"><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<form th:action="@{/prescriptions/update/{id}(id=${prescription.id})}" th:object="${prescription}" method="post">
<div class="mb-3"><label class="form-label">Customer *</label><select class="form-select" th:field="*{customerId}" required><option value="">Select customer</option><option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name + ' — ' + c.phone}"></option></select></div>
<h5 class="mt-4 mb-3">Right eye (OD)</h5><div class="row g-3"><div class="col-md-3"><label class="form-label">SPH</label><div class="input-group"><span class="input-group-text">±</span><input class="form-control" type="number" step="0.25" th:field="*{rightSph}"></div></div><div class="col-md-3"><label class="form-label">CYL</label><div class="input-group"><span class="input-group-text">±</span><input class="form-control" type="number" step="0.25" th:field="*{rightCyl}"></div></div><div class="col-md-3"><label class="form-label">Axis</label><input class="form-control" type="number" min="0" max="180" th:field="*{rightAxis}"></div><div class="col-md-3"><label class="form-label">Vision</label><input class="form-control" th:field="*{rightVn}"></div></div>
<h5 class="mt-4 mb-3">Left eye (OS)</h5><div class="row g-3"><div class="col-md-3"><label class="form-label">SPH</label><div class="input-group"><span class="input-group-text">±</span><input class="form-control" type="number" step="0.25" th:field="*{leftSph}"></div></div><div class="col-md-3"><label class="form-label">CYL</label><div class="input-group"><span class="input-group-text">±</span><input class="form-control" type="number" step="0.25" th:field="*{leftCyl}"></div></div><div class="col-md-3"><label class="form-label">Axis</label><input class="form-control" type="number" min="0" max="180" th:field="*{leftAxis}"></div><div class="col-md-3"><label class="form-label">Vision</label><input class="form-control" th:field="*{leftVn}"></div></div>
<div class="row g-3 mt-2"><div class="col-md-4"><label class="form-label">Addition (ADD)</label><div class="input-group"><span class="input-group-text">±</span><input class="form-control" type="number" step="0.25" th:field="*{addition}"></div></div><div class="col-md-4"><label class="form-label">Lens type</label><input class="form-control" th:field="*{glassType}"></div><div class="col-md-4"><label class="form-label">Prescription date</label><input class="form-control" type="date" th:field="*{prescriptionDate}"></div><div class="col-md-4"><label class="form-label">Expiry date</label><input class="form-control" type="date" th:field="*{expiryDate}"></div><div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" rows="3" th:field="*{notes}"></textarea></div></div>
<div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" th:href="@{/prescriptions}">Cancel</a><button class="btn btn-primary" type="submit">Update prescription</button></div></form></div></div></div></div><div th:replace="layout/footer :: footer"></div></body></html>
