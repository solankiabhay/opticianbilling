<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="layout/header :: header"></head><body>
<div th:replace="layout/sidebar :: sidebar"></div><div class="main-content"><div th:replace="layout/navbar :: navbar"></div><div class="container-fluid p-4">
<div class="d-flex justify-content-between align-items-center mb-4"><div><h3 class="fw-bold">Prescription details</h3><p class="text-muted mb-0" th:text="${prescription.customerName + ' — ' + prescription.customerPhone}"></p></div><div><a class="btn btn-outline-secondary" th:href="@{/prescriptions}">Back</a> <a class="btn btn-primary" th:href="@{/prescriptions/edit/{id}(id=${prescription.id})}">Edit</a></div></div>
<div class="card shadow-sm"><div class="card-body"><div class="row mb-4"><div class="col-md-4"><small class="text-muted">Prescription date</small><div class="fw-semibold" th:text="${prescription.prescriptionDate}"></div></div><div class="col-md-4"><small class="text-muted">Expiry date</small><div class="fw-semibold" th:text="${prescription.expiryDate}"></div></div><div class="col-md-4"><small class="text-muted">Lens type</small><div class="fw-semibold" th:text="${prescription.glassType}"></div></div></div>
<div class="table-responsive"><table class="table table-bordered text-center"><thead class="table-light"><tr><th>Eye</th><th>SPH</th><th>CYL</th><th>Axis</th><th>Vision</th></tr></thead><tbody><tr><th>Right (OD)</th><td th:text="${prescription.rightSphDisplay}"></td><td th:text="${prescription.rightCylDisplay}"></td><td th:text="${prescription.rightAxis != null ? prescription.rightAxis : '—'}"></td><td th:text="${prescription.rightVn}"></td></tr><tr><th>Left (OS)</th><td th:text="${prescription.leftSphDisplay}"></td><td th:text="${prescription.leftCylDisplay}"></td><td th:text="${prescription.leftAxis != null ? prescription.leftAxis : '—'}"></td><td th:text="${prescription.leftVn}"></td></tr><tr><th colspan="4" class="text-end">Addition (ADD)</th><td class="fw-bold" th:text="${prescription.additionDisplay}"></td></tr></tbody></table></div>
<div class="mt-3"><strong>Notes:</strong><p class="text-muted mb-0" th:text="${prescription.notes != null ? prescription.notes : '—'}"></p></div></div></div></div></div><div th:replace="layout/footer :: footer"></div></body></html>
