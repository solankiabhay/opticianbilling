<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="layout/header :: header"></head><body>
<div th:replace="layout/sidebar :: sidebar"></div><div class="main-content"><div th:replace="layout/navbar :: navbar"></div><div class="container-fluid p-4">
<div class="d-flex justify-content-between align-items-center mb-4"><div><h3 class="fw-bold">Prescriptions</h3><p class="text-muted mb-0">Optical power records by customer</p></div><a class="btn btn-primary" th:href="@{/prescriptions/add}"><i class="fa-solid fa-plus me-2"></i>New prescription</a></div>
<div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Customer</th><th>Date</th><th>Right eye SPH / CYL</th><th>Left eye SPH / CYL</th><th>ADD</th><th>Expiry</th><th>Actions</th></tr></thead><tbody>
<tr th:each="p : ${prescriptions}"><td><div class="fw-semibold" th:text="${p.customerName}"></div><small class="text-muted" th:text="${p.customerPhone}"></small></td><td th:text="${p.prescriptionDate}"></td><td><span th:text="${p.rightSphDisplay}"></span> / <span th:text="${p.rightCylDisplay}"></span></td><td><span th:text="${p.leftSphDisplay}"></span> / <span th:text="${p.leftCylDisplay}"></span></td><td th:text="${p.additionDisplay}"></td><td th:text="${p.expiryDate}"></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/prescriptions/view/{id}(id=${p.id})}"><i class="fa-solid fa-eye"></i></a> <a class="btn btn-sm btn-outline-warning" th:href="@{/prescriptions/edit/{id}(id=${p.id})}"><i class="fa-solid fa-pen"></i></a></td></tr>
<tr th:if="${#lists.isEmpty(prescriptions)}"><td colspan="7" class="text-center text-muted py-4">No prescriptions recorded yet.</td></tr>
</tbody></table></div></div></div></div><div th:replace="layout/footer :: footer"></div></body></html>
