<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="layout/header :: header"></head><body>
<div th:replace="layout/sidebar :: sidebar"></div><main class="main-content"><div th:replace="layout/navbar :: navbar"></div><div class="container-fluid p-4">
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4"><div><h3 class="fw-bold mb-1">Product inventory</h3><p class="text-muted mb-0">Manage frames, lenses, sunglasses and optical services stock</p></div><a class="btn btn-primary" th:href="@{/products/add}"><i class="fa-solid fa-plus me-1"></i>Add product</a></div>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><div class="alert alert-warning" th:if="${lowStockCount > 0}"><i class="fa-solid fa-triangle-exclamation me-1"></i><strong th:text="${lowStockCount}"></strong> active product(s) are at or below reorder level.</div>
<div class="card shadow-sm mb-3"><div class="card-body"><form method="get" th:action="@{/products}" class="row g-2"><div class="col-md-10"><input class="form-control" name="q" th:value="${q}" placeholder="Search product name or SKU"></div><div class="col-md-2 d-grid"><button class="btn btn-outline-primary">Search</button></div></form></div></div>
<div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Product / SKU</th><th>Category</th><th>Brand</th><th>Sell price</th><th>Stock</th><th>Status</th><th>Quick stock update</th><th></th></tr></thead><tbody>
<tr th:each="p : ${products}"><td><strong th:text="${p.name}"></strong><br><small class="text-muted" th:text="${p.sku}"></small></td><td th:text="${p.category ?: '—'}"></td><td th:text="${p.brand ?: '—'}"></td><td th:text="'₹' + ${#numbers.formatDecimal(p.sellingPrice,1,2)}"></td><td><span th:text="${p.stockQuantity}"></span><small class="d-block text-muted" th:text="'Reorder at ' + ${p.reorderLevel}"></small></td><td><span class="badge" th:classappend="${!p.active ? ' bg-secondary' : (p.stockQuantity <= p.reorderLevel ? ' bg-warning text-dark' : ' bg-success')}" th:text="${!p.active ? 'Inactive' : (p.stockQuantity <= p.reorderLevel ? 'Low stock' : 'In stock')}"></span></td><td><form method="post" th:action="@{/products/stock/{id}(id=${p.id})}" class="d-flex gap-1"><input class="form-control form-control-sm" style="max-width:90px" type="number" name="delta" value="1" min="-100000" max="100000" required aria-label="Stock adjustment"><button class="btn btn-sm btn-outline-success" title="Apply stock adjustment"><i class="fa-solid fa-check"></i></button></form></td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/products/edit/{id}(id=${p.id})}">Edit</a><form method="post" class="d-inline" th:if="${p.active}" th:action="@{/products/deactivate/{id}(id=${p.id})}" onsubmit="return confirm('Deactivate this product?');"><button class="btn btn-sm btn-outline-danger">Deactivate</button></form></td></tr>
<tr th:if="${#lists.isEmpty(products)}"><td colspan="8" class="text-center text-muted py-4">No products found. Add your first inventory item.</td></tr>
</tbody></table></div></div></div></main><div th:replace="layout/footer :: footer"></div></body></html>
