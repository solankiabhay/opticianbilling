<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="layout/header :: header"></head><body>
<div th:replace="layout/sidebar :: sidebar"></div><main class="main-content"><div th:replace="layout/navbar :: navbar"></div><div class="container-fluid p-4">
<div class="mb-4"><h3 class="fw-bold" th:text="${product.id == null ? 'Add product' : 'Edit product'}"></h3><p class="text-muted mb-0">Use a unique SKU to identify each inventory item.</p></div><div class="card shadow-sm"><div class="card-body p-4"><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<form method="post" th:action="@{/products/save}" th:object="${product}"><input type="hidden" th:field="*{id}"><div class="row g-3">
<div class="col-md-6"><label class="form-label">Product name *</label><input class="form-control" th:field="*{name}" maxlength="120" required></div><div class="col-md-6"><label class="form-label">SKU / code *</label><input class="form-control text-uppercase" th:field="*{sku}" maxlength="40" required></div>
<div class="col-md-4"><label class="form-label">Category</label><select class="form-select" th:field="*{category}"><option value="">Select category</option><option value="Frames">Frames</option><option value="Lenses">Lenses</option><option value="Sunglasses">Sunglasses</option><option value="Contact lenses">Contact lenses</option><option value="Accessories">Accessories</option><option value="Service">Service</option><option value="Other">Other</option></select></div><div class="col-md-4"><label class="form-label">Brand</label><input class="form-control" th:field="*{brand}" maxlength="80"></div><div class="col-md-4"><label class="form-label">Opening stock *</label><input class="form-control" type="number" min="0" th:field="*{stockQuantity}" required></div>
<div class="col-md-4"><label class="form-label">Purchase price (₹) *</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{purchasePrice}" required></div><div class="col-md-4"><label class="form-label">Selling price (₹) *</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{sellingPrice}" required></div><div class="col-md-4"><label class="form-label">Low-stock alert at *</label><input class="form-control" type="number" min="0" th:field="*{reorderLevel}" required></div>
<div class="col-12"><label class="form-label">Description</label><textarea class="form-control" rows="3" maxlength="1000" th:field="*{description}"></textarea></div><div class="col-12 form-check ms-2" th:if="${product.id != null}"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label">Product is active</label></div>
</div><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" th:href="@{/products}">Cancel</a><button class="btn btn-primary" type="submit">Save product</button></div></form></div></div></div></main><div th:replace="layout/footer :: footer"></div></body></html>
