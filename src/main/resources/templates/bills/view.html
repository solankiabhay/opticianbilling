<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="layout/header :: header"></head><body>
<div th:replace="layout/sidebar :: sidebar"></div><div class="main-content"><div th:replace="layout/navbar :: navbar"></div><div class="container-fluid p-4">
<div class="d-flex justify-content-between align-items-center mb-4"><div><h3 class="fw-bold">Invoice <span th:text="${bill.billNumber}"></span></h3><p class="text-muted mb-0">Customer billing summary</p></div><a class="btn btn-outline-secondary" th:href="@{/bills}">Back to bills</a></div>
<div class="card shadow-sm"><div class="card-body p-4"><div class="row mb-4"><div class="col-md-6"><small class="text-muted">Customer</small><h5 th:text="${bill.customer.name}"></h5><div th:text="${bill.customer.phone}"></div></div><div class="col-md-3"><small class="text-muted">Invoice date</small><div class="fw-semibold" th:text="${bill.billDate}"></div></div><div class="col-md-3"><small class="text-muted">Status</small><div class="fw-semibold" th:text="${bill.status}"></div></div></div>
<table class="table"><tbody><tr><td>Items subtotal</td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(bill.subtotal,1,2)}"></td></tr><tr th:if="${bill.contactLensCharges != null and bill.contactLensCharges.signum() > 0}"><td>Contact lenses <span th:text="${bill.contactLensName}"></span></td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(bill.contactLensCharges,1,2)}"></td></tr><tr th:if="${bill.sunglassCharges != null and bill.sunglassCharges.signum() > 0}"><td>Sunglasses <span th:text="${bill.sunglassName}"></span></td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(bill.sunglassCharges,1,2)}"></td></tr><tr><td>Eye testing</td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(bill.eyeTestingCharges,1,2)}"></td></tr><tr><td>Other charges</td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(bill.otherCharges,1,2)}"></td></tr><tr class="table-light fw-bold"><td>Total</td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(bill.total,1,2)}"></td></tr><tr><td>Advance paid</td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(bill.advance,1,2)}"></td></tr><tr class="fw-bold"><td>Balance due</td><td class="text-end" th:text="'₹' + ${#numbers.formatDecimal(bill.balance,1,2)}"></td></tr></tbody></table>
<div class="row mt-3"><div class="col-md-4"><small class="text-muted">Payment mode</small><div th:text="${bill.paymentMode != null ? bill.paymentMode : '—'}"></div></div><div class="col-md-4"><small class="text-muted">Delivery date</small><div th:text="${bill.deliveryDate != null ? bill.deliveryDate : '—'}"></div></div><div class="col-md-4"><small class="text-muted">Notes</small><div th:text="${bill.notes != null ? bill.notes : '—'}"></div></div></div>
</div></div></div></div><div th:replace="layout/footer :: footer"></div></body></html>
