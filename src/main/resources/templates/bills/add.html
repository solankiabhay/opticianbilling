<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="layout/header :: header"></head><body>
<div th:replace="layout/sidebar :: sidebar"></div><div class="main-content"><div th:replace="layout/navbar :: navbar"></div><div class="container-fluid p-4">
<div class="mb-4"><h3 class="fw-bold">Create invoice</h3><p class="text-muted mb-0">Create a customer invoice with optical services and additional charges</p></div>
<div class="card shadow-sm"><div class="card-body p-4"><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<form method="post" th:action="@{/bills/save}" th:object="${bill}">
<div class="row g-3"><div class="col-md-6"><label class="form-label">Customer *</label><select class="form-select" th:field="*{customerId}" required><option value="">Select customer</option><option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name + ' — ' + c.phone}"></option></select></div><div class="col-md-3"><label class="form-label">Bill date</label><input class="form-control" type="date" th:field="*{billDate}"></div><div class="col-md-3"><label class="form-label">Lens type</label><input class="form-control" th:field="*{glassType}"></div>
<div class="col-md-4"><label class="form-label">Items subtotal (₹)</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{subtotal}" required></div><div class="col-md-4"><label class="form-label">Contact lens name</label><input class="form-control" th:field="*{contactLensName}"></div><div class="col-md-4"><label class="form-label">Contact lens charges (₹)</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{contactLensCharges}"></div>
<div class="col-md-4"><label class="form-label">Sunglasses name</label><input class="form-control" th:field="*{sunglassName}"></div><div class="col-md-4"><label class="form-label">Sunglasses charges (₹)</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{sunglassCharges}"></div><div class="col-md-4"><label class="form-label">Eye testing charges (₹)</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{eyeTestingCharges}"></div>
<div class="col-md-4"><label class="form-label">Other charges (₹)</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{otherCharges}"></div><div class="col-md-4"><label class="form-label">Advance paid (₹)</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{advance}"></div><div class="col-md-4"><label class="form-label">Payment mode</label><select class="form-select" th:field="*{paymentMode}"><option value="">Select</option><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option><option>Other</option></select></div>
<div class="col-md-4"><label class="form-label">Delivery in (days)</label><input class="form-control" type="number" min="0" max="365" th:field="*{deliveryDays}"></div><div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" rows="3" th:field="*{notes}"></textarea></div></div>
<p class="small text-muted mt-3">Total is calculated from subtotal plus additional charges. Balance is calculated after advance payment.</p>
<div class="d-flex justify-content-end gap-2 mt-3"><a class="btn btn-outline-secondary" th:href="@{/bills}">Cancel</a><button class="btn btn-primary" type="submit">Save invoice</button></div></form></div></div></div></div><div th:replace="layout/footer :: footer"></div></body></html>
