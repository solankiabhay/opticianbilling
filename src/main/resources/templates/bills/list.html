<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="layout/header :: header"></head><body>
<div th:replace="layout/sidebar :: sidebar"></div><div class="main-content"><div th:replace="layout/navbar :: navbar"></div><div class="container-fluid p-4">
<div class="d-flex justify-content-between align-items-center mb-4"><div><h3 class="fw-bold">Bills & invoices</h3><p class="text-muted mb-0">Review invoices and outstanding balances</p></div><div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/bills/export.csv}"><i class="fa-solid fa-file-csv me-1"></i>Export CSV</a><button class="btn btn-outline-secondary" onclick="window.print()"><i class="fa-solid fa-print me-1"></i>Print list</button><a class="btn btn-primary" th:href="@{/bills/add}"><i class="fa-solid fa-file-invoice me-2"></i>Create bill</a></div></div>
<div class="row g-3 mb-4"><div class="col-md-4"><div class="card shadow-sm"><div class="card-body"><div class="text-muted small">Invoices</div><div class="fs-4 fw-bold" th:text="${#lists.size(bills)}">0</div></div></div></div><div class="col-md-4"><div class="card shadow-sm"><div class="card-body"><div class="text-muted small">Billed value</div><div class="fs-4 fw-bold" th:text="'₹' + ${#numbers.formatDecimal(billedTotal,1,2)}">₹0.00</div></div></div></div><div class="col-md-4"><div class="card shadow-sm"><div class="card-body"><div class="text-muted small">Outstanding balance</div><div class="fs-4 fw-bold text-danger" th:text="'₹' + ${#numbers.formatDecimal(outstandingTotal,1,2)}">₹0.00</div></div></div></div></div>
<div class="card shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Total</th><th>Received</th><th>Balance</th><th>Status</th><th></th></tr></thead><tbody>
<tr th:each="b : ${bills}"><td class="fw-semibold" th:text="${b.billNumber}"></td><td><span th:text="${b.customer.name}"></span><br><small class="text-muted" th:text="${b.customer.phone}"></small></td><td th:text="${b.billDate}"></td><td th:text="'₹' + ${#numbers.formatDecimal(b.total,1,2)}"></td><td th:text="'₹' + ${#numbers.formatDecimal(b.advance,1,2)}"></td><td th:text="'₹' + ${#numbers.formatDecimal(b.balance,1,2)}"></td><td><span class="badge" th:classappend="${b.status == 'PAID' ? ' bg-success' : ' bg-warning text-dark'}" th:text="${b.status}"></span></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/bills/view/{id}(id=${b.id})}"><i class="fa-solid fa-eye"></i> View</a></td></tr>
<tr th:if="${#lists.isEmpty(bills)}"><td colspan="8" class="text-center text-muted py-4">No invoices yet. Create the first invoice to get started.</td></tr>
</tbody></table></div></div></div></div><div th:replace="layout/footer :: footer"></div>
<style>@media print{.app-sidebar,.app-navbar,.btn{display:none!important}.main-content{margin:0!important}.container-fluid{max-width:none!important}}</style></body></html>
