spring.application.name=surya-optics
server.port=${PORT:8080}
server.servlet.context-path=/
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/surya_optics?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false
spring.thymeleaf.cache=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mvc.format.date=yyyy-MM-dd
spring.jackson.time-zone=Asia/Kolkata
logging.level.com.surya.optics=INFO
logging.file.name=${LOG_FILE:logs/surya-optics.log}
app.prescription.default-expiry-years=2
app.security.session-timeout=30
