name: Java CI
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'android-app/**'
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress test
